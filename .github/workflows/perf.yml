name: perf

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  measure:
    name: measure
    runs-on: [self-hosted, trip-planner]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    env:
      SESSION_SECRET: ci-only-secret-ci-only-secret-0000000
      AUTH_SECRET: ci-only-auth-secret-ci-only-auth-0000000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate throwaway build secrets
        run: |
          echo "DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: npx next build
      - name: Point Lighthouse at Playwright's Chromium
        run: |
          npx playwright install chromium
          echo "CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Hot paths and MCP get_trip
        id: hot
        continue-on-error: true
        run: npx vitest run --config vitest.perf.config.mts
      - name: First load JavaScript per route
        id: bundle
        continue-on-error: true
        run: npx tsx scripts/bundle-budget.ts
      - name: Start the built app
        run: |
          PERF_PORT=3199 npx tsx perf/serve.ts .next/perf/server.json > .next/perf/server.log 2>&1 &
          for i in $(seq 1 120); do
            if [ -s .next/perf/server.json ]; then exit 0; fi
            sleep 1
          done
          cat .next/perf/server.log
          exit 1
      - name: Read the demo session cookie
        run: |
          cookie=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.next/perf/server.json', 'utf8')).cookie)")
          echo "::add-mask::$cookie"
          echo "LH_COOKIE=$cookie" >> "$GITHUB_ENV"
          echo "LH_HEADERS={\"Cookie\":\"$cookie\"}" >> "$GITHUB_ENV"
      - name: Lighthouse mobile
        id: lh_mobile
        continue-on-error: true
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json "--collect.settings.extraHeaders=$LH_HEADERS"
      - name: Lighthouse desktop
        id: lh_desktop
        continue-on-error: true
        run: npx --yes @lhci/cli@0.15.1 autorun --config=perf/lighthouserc.desktop.json "--collect.settings.extraHeaders=$LH_HEADERS"
      - name: Write the summary
        id: summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          status=0
          npx tsx perf/summary.ts > /dev/null || status=$?
          if [ -f .next/perf/summary.md ]; then cat .next/perf/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit $status
      - name: Keep the session cookie and assistant token out of the artifact
        id: strip
        if: ${{ !cancelled() }}
        run: |
          rm -f .next/perf/server.json .next/perf/server.log
          find .next/perf -name '*.report.html' -delete
          find .next/perf -name '*.report.json' -exec node -e "const fs = require('fs'); const f = process.argv[1]; const r = JSON.parse(fs.readFileSync(f, 'utf8')); if (r.configSettings) delete r.configSettings.extraHeaders; fs.writeFileSync(f, JSON.stringify(r))" {} \;
          if [ -n "$LH_COOKIE" ] && grep -rqF "$LH_COOKIE" .next/perf; then
            echo "::error::The session cookie is still present in the perf results, so they will not be uploaded."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.strip.outcome == 'success' }}
        with:
          name: perf
          path: .next/perf/
          if-no-files-found: ignore
          retention-days: 14
      - name: Fail when any budget failed
        if: steps.hot.outcome == 'failure' || steps.bundle.outcome == 'failure' || steps.lh_mobile.outcome == 'failure' || steps.lh_desktop.outcome == 'failure' || steps.summary.outcome == 'failure'
        run: |
          echo "::error::A performance budget failed. Hot paths: ${{ steps.hot.outcome }}, bundle: ${{ steps.bundle.outcome }}, Lighthouse mobile: ${{ steps.lh_mobile.outcome }}, Lighthouse desktop: ${{ steps.lh_desktop.outcome }}, summary: ${{ steps.summary.outcome }}."
          exit 1

  comment:
    name: pull request comment
    needs: measure
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, trip-planner]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: perf
          path: perf-results
      - name: Post or update the one performance comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/${GH_REPO}/issues/${PR}/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- trip-planner-perf -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/${GH_REPO}/issues/comments/${id}" --field body=@perf-results/summary.md
          else
            gh api --method POST "repos/${GH_REPO}/issues/${PR}/comments" --field body=@perf-results/summary.md
          fi
