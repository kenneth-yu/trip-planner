name: merge-gate

on:
  workflow_run:
    workflows: [ci, perf, security]
    types: [completed]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, ready_for_review, labeled, unlabeled]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: merge-gate
  cancel-in-progress: false

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.comment.user.login == github.repository_owner && (contains(github.event.comment.body, 'Verdict:') || contains(github.event.comment.body, 'Applied') || contains(github.event.comment.body, 'Declined')))
    steps:
      - name: Let a burst of events settle into one run
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: sleep 60
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Evaluate every open pull request and merge at most one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_TOKEN: ${{ secrets.GATE_TOKEN }}
          GATE_OWNER: ${{ github.repository_owner }}
        run: node tools/merge-gate.mjs --sweep
